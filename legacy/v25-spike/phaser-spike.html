<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Knowsters v25 · Phaser Rendering Spike (Referenz)</title>
  <link rel="stylesheet" href="phaser-spike.css?v=26">
</head>
<body>
  <main id="game-shell" aria-label="Knowsters Phaser Rendering Spike">
    <div id="game"></div>
    <div id="load-error" hidden>
      <strong>Rendering konnte nicht gestartet werden.</strong>
      <span id="load-error-detail">Details folgen …</span>
    </div>
  </main>
  <script>
    // M0: Diagnose + Service-Worker-Neutralisierung (siehe docs/KNOWN_ISSUES.md).
    (function () {
      var errors = [];
      window.__ks25Errors = errors;
      window.addEventListener('error', function (e) { errors.push((e.message || 'Fehler') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
      window.addEventListener('unhandledrejection', function (e) { errors.push('Promise: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason))); });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) { regs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) { keys.filter(function (k) { return k.indexOf('knowsters-') === 0; }).forEach(function (k) { caches.delete(k); }); }).catch(function () {});
      }
    })();
  </script>
  <script src="phaser.min.js?v=4.2.1"></script>
  <script src="ks25-core.js?v=26"></script>
  <script src="ks25-battle.js?v=26"></script>
  <script src="ks25-boot.js?v=26"></script>
</body>
</html>
