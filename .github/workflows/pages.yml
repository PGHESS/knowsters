name: Verify and deploy Knowsters

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Legacy tests (v22 reference)
        run: npm run test:legacy
      - name: Build
        run: npm run build
      - name: Assemble site (app at /, reference stands at /legacy/)
        run: |
          rm -rf _site
          cp -R apps/game/dist _site
          mkdir -p _site/legacy
          cp -R legacy/v22 _site/legacy/v22
          cp -R legacy/v25-spike _site/legacy/v25-spike
          cp node_modules/phaser/dist/phaser.min.js _site/legacy/v25-spike/phaser.min.js
          cp legacy/README.md _site/legacy/README.md
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=legacy/v25-spike/phaser-spike.html"><title>Knowsters Spike</title><a href="legacy/v25-spike/phaser-spike.html">Weiter zum v25-Spike</a>' > _site/phaser-spike.html
          touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
