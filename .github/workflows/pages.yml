name: Deploy Knowsters to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Knowsters-v*-WebDeploy-small.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare latest static site
        run: |
          rm -rf _site _unpacked
          mkdir -p _site _unpacked
          ZIP="$(find . -maxdepth 1 -type f -name 'Knowsters-v*-WebDeploy-small.zip' -printf '%f\n' | sort -V | tail -1)"
          echo "Deploying $ZIP"
          unzip -q "$ZIP" -d _unpacked
          BUILD_DIR="$(find _unpacked -mindepth 1 -maxdepth 1 -type d | head -1)"
          cp -R "$BUILD_DIR"/. _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
